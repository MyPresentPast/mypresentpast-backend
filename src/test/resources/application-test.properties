# Configuración para tests

# Base de datos H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate para tests
# spring.jpa.database-platform no es suficiente para sobrescribir el dialecto cuando
# application.properties define spring.jpa.properties.hibernate.dialect=PostgreSQLDialect
# (propiedad más específica que toma precedencia). Se necesita override explícito con la
# misma propiedad para que Hibernate use H2Dialect y genere DDL compatible con H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# import.sql contiene datos y sintaxis específicos de PostgreSQL que fallan en H2.
# Se desactiva la ejecución automática para evitar errores al levantar el contexto de test.
spring.sql.init.mode=never

# Desactivar configuraciones que requieren servicios externos en tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Logging
logging.level.com.mypresentpast=DEBUG
logging.level.org.springframework.test=DEBUG