name: mypresentpast

services:
  app:
    build: .
    container_name: mypresentpast-backend
    ports:
      # El frontend compartido consume la API mediante localhost:8081.
      - "8081:8092"
    env_file:
      - .env
    environment:
      # Dentro de Docker se usa el nombre del servicio y el puerto interno de PostgreSQL.
      DB_HOST: db
      DB_PORT: 5432
      SERVER_PORT: 8092
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mypresentpast-network

  frontend:
    build:
      context: ../mypresentpast-frontend
    container_name: mypresentpast-frontend
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - mypresentpast-network

  db:
    image: postgres:16
    container_name: mypresentpast-database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mypresentpast-network

volumes:
  postgres_data:

networks:
  mypresentpast-network:
    driver: bridge
